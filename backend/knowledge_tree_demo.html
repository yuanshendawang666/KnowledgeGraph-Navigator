<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知谱智航 · 知识树</title>
<script src="https://cdn.bootcdn.net/ajax/libs/vis/4.21.0/vis.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f1f5f9;color:#1e293b}
.top{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:18px}
.top select{padding:6px 12px;border-radius:6px;border:none}
.container{display:flex;height:calc(100vh - 56px)}
.panel{flex:1;overflow-y:auto;padding:16px}
.panel.left{max-width:420px;border-right:1px solid #e2e8f0;background:#fff}
.panel.right{flex:2;background:#fafbfc}
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;border:1px solid #e2e8f0}

/* ── 树 ── */
.tree{margin:0;padding:0}
.tree,.tree ul{list-style:none}
.tree ul{padding-left:24px;overflow:hidden;max-height:0;transition:max-height .35s ease}
.tree ul.open{max-height:2000px}
.tree li{position:relative;padding:2px 0}
.tree-node{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;transition:background .15s}
.tree-node:hover{background:#f1f5f9}
.tree-node .icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:transform .2s}
.tree-node .icon.open{transform:rotate(90deg)}
.tree-node .icon.mod{background:#4f46e5;color:#fff}
.tree-node .icon.sub{background:#6366f1;color:#fff}
.tree-node .icon.kp{background:#e0e7ff;color:#4f46e5;font-size:9px}
.tree-node .name{font-size:13px;flex:1}
.tree-node .name.mod{font-weight:700;color:#1e1b4b}
.tree-node .name.sub{font-weight:600;color:#312e81}
.tree-node .name.kp{font-weight:400;color:#475569}
.tree-node .badge{font-size:10px;padding:1px 8px;border-radius:10px}
.tree-node .badge.m{background:#dcfce7;color:#166534}
.tree-node .badge.p{background:#fef3c7;color:#92400e}
.tree-node .badge.n{background:#f1f5f9;color:#94a3b8}

/* ── 图 ── */
.graph-box{width:100%;height:100%;min-height:500px;border:1px solid #e2e8f0;border-radius:8px;background:#fafbfc}
.toolbar{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.toolbar button{padding:6px 14px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;cursor:pointer;font-size:12px}
.toolbar button.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.legend{display:flex;gap:14px;font-size:11px;color:#64748b;margin-left:auto}
.legend span{display:flex;align-items:center;gap:4px}
.legend .ld{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ── 加载 ── */
.loading{text-align:center;padding:40px;color:#64748b}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class=top>
  <h1>🎓 知谱智航 · 知识树 + 图谱</h1>
  <select id=courseSelect onchange=loadAll()></select>
</div>

<div class=container>
  <!-- 左侧: 可折叠知识树 -->
  <div class="panel left" id=treePanel>
    <h3 style="margin-bottom:10px">📁 知识结构 (点击展开/折叠)</h3>
    <div id=treeContent><div class=loading><div class=spin></div> 加载中...</div></div>
  </div>

  <!-- 右侧: Neo4j 图谱 -->
  <div class="panel right">
    <div class=toolbar>
      <button onclick="setDepth(0)" id=btn0>仅模块</button>
      <button onclick="setDepth(1)" id=btn1>模块+子模块</button>
      <button onclick="setDepth(2)" id=btn2 class=active>全部节点</button>
      <div class=legend>
        <span><span class=ld style=background:#4f46e5></span>模块</span>
        <span><span class=ld style=background:#6366f1></span>子模块</span>
        <span><span class=ld style=background:#22c55e;width:20px;height:3px></span>先修关系</span>
      </div>
    </div>
    <div class="graph-box" id=graphBox></div>
  </div>
</div>

<script>
var TOKEN='', COURSE_ID=0, DEPTH=2, graphNetwork=null;

async function init(){
  try{
    var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'prof',password:'123'})});
    TOKEN=(await r.json()).access_token;
    var cr=await fetch('/api/courses/',{headers:{'Authorization':'Bearer '+TOKEN}});
    var courses=await cr.json();
    var sel=document.getElementById('courseSelect');
    courses.forEach(function(c){
      var o=document.createElement('option');o.value=c.id;o.textContent=c.title+' ('+c.knowledge_point_count+'知识点)';sel.appendChild(o);
    });
    // 选知识点最多的课程
    var best=courses.reduce(function(a,b){return (a.knowledge_point_count||0)>=(b.knowledge_point_count||0)?a:b;},courses[0]);
    COURSE_ID=best.id;sel.value=COURSE_ID;
    loadAll();
  }catch(e){document.getElementById('treeContent').innerHTML='<p style=color:red>连接后端失败: '+e.message+'</p>';}
}

async function loadAll(){
  document.getElementById('treeContent').innerHTML='<div class=loading><div class=spin></div></div>';
  COURSE_ID=document.getElementById('courseSelect').value;
  try{
    var r=await fetch('/api/courses/'+COURSE_ID+'/graph?depth='+DEPTH,{headers:{'Authorization':'Bearer '+TOKEN}});
    var g=await r.json();
    renderTree(g.tree);
    renderGraph(g.nodes,g.edges);
  }catch(e){console.error(e);}
}

// ══════════════════════════════════════
// 可折叠知识树
// ══════════════════════════════════════
function renderTree(tree){
  if(!tree||!tree.length){document.getElementById('treeContent').innerHTML='<p style=color:#64748b>暂无知识点，请先提取</p>';return;}

  function build(nodes,level){
    if(!nodes||!nodes.length)return'';
    var ul='<ul class="'+(level<2?'open':'')+'">';
    nodes.forEach(function(n){
      var hasKids=n.children&&n.children.length;
      var l=n.level||2;
      var iconClass=l===0?'mod':l===1?'sub':'kp';
      var nameClass=l===0?'mod':l===1?'sub':'kp';
      var icon=hasKids?'▶':'•';
      var statusClass=n.status==='mastered'?'m':n.status==='in_progress'?'p':'n';
      var statusText=n.status==='mastered'?'已掌握':n.status==='in_progress'?'学习中':'';
      var onClick=hasKids?'onclick=toggleKids(event)':'';
      ul+='<li>';
      ul+='<div class=tree-node '+onClick+' data-has-kids='+hasKids+'>';
      ul+='<span class="icon '+iconClass+'">'+icon+'</span>';
      ul+='<span class="name '+nameClass+'">'+n.label+'</span>';
      if(n.mastery_level>0){ul+='<span style="font-size:11px;color:#64748b">'+(n.mastery_level*100).toFixed(0)+'%</span>';}
      if(statusText){ul+='<span class="badge '+statusClass+'">'+statusText+'</span>';}
      ul+='</div>';
      if(hasKids)ul+=build(n.children,Math.min(2,level+1));
      ul+='</li>';
    });
    ul+='</ul>';
    return ul;
  }
  document.getElementById('treeContent').innerHTML='<ul class=tree>'+build(tree,0)+'</ul>';
}

function toggleKids(e){
  e.stopPropagation();
  var li=e.target.closest('li');
  var ul=li.querySelector('ul');
  if(!ul)return;
  var icon=li.querySelector('.icon');
  if(ul.classList.contains('open')){ul.classList.remove('open');icon.classList.remove('open');}
  else{ul.classList.add('open');icon.classList.add('open');}
}

// ══════════════════════════════════════
// Neo4j 图谱 (vis.js)
// ══════════════════════════════════════
function renderGraph(nodes,edges){
  if(typeof vis==='undefined'){setTimeout(function(){renderGraph(nodes,edges);},300);return;}
  var container=document.getElementById('graphBox');
  container.innerHTML='';

  var nodeArr=nodes.map(function(n){
    var l=n.level||2;
    var colors=[{bg:'#4f46e5',bd:'#3730a3',sz:18},{bg:'#6366f1',bd:'#4f46e5',sz:14},{bg:'#a5b4fc',bd:'#818cf8',sz:10}];
    var c=colors[Math.min(2,l)];
    return{id:n.id,label:n.label,level:l,is_module:n.is_module,
      color:{background:c.bg,border:c.bd},font:{color:l<2?'#fff':'#3730a3',size:c.sz,face:'Microsoft YaHei'},
      shape:l<2?'box':'ellipse',margin:l<2?10:6,borderWidth:l<2?2:1,
      size:l<2?undefined:8};
  });

  var edgeArr=edges.map(function(e){
    var isTree=e.relation==='PART_OF';
    return{from:e.source,to:e.target,
      arrows:isTree?{to:{enabled:false}}:{to:{enabled:true,scaleFactor:.7}},
      color:{color:isTree?'#cbd5e1':'#22c55e',hover:isTree?'#94a3b8':'#16a34a'},
      width:isTree?1:2,dashes:isTree?[4,4]:false};
  });

  var data={nodes:new vis.DataSet(nodeArr),edges:new vis.DataSet(edgeArr)};
  var options={
    layout:{hierarchical:{direction:'LR',sortMethod:'directed',nodeSpacing:140,levelSeparation:250,treeSpacing:20,blockShifting:true,edgeMinimization:true,parentCentralization:true}},
    physics:{enabled:true,hierarchicalRepulsion:{nodeDistance:180,centralGravity:0.3,springLength:200,springConstant:0.01,damping:0.09},solver:'hierarchicalRepulsion'},
    interaction:{dragNodes:true,dragView:true,zoomView:true,hover:true,tooltipDelay:100,navigationButtons:true,keyboard:true}
  };
  graphNetwork=new vis.Network(container,data,options);

  // 双击折叠/展开
  graphNetwork.on('doubleClick',function(params){
    if(params.nodes.length){
      // 双击模块节点可以切换深度
      console.log('Double-clicked:', params.nodes[0]);
    }
  });
}

function setDepth(d){
  DEPTH=d;
  document.getElementById('btn0').classList.toggle('active',d===0);
  document.getElementById('btn1').classList.toggle('active',d===1);
  document.getElementById('btn2').classList.toggle('active',d===2);
  loadAll();
}

init();
</script>
</body>
</html>
