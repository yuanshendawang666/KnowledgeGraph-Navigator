services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 容器内使用持久化目录；不要使用开发机的相对路径。
      DATABASE_URL: sqlite:////app/data/knowledge_navigator.db
      UPLOAD_DIR: /app/uploads
      DEBUG: "false"
      # 前端通过同域 /api 请求，实际生产域名在这里替换。
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
